# Profil ÉCO — Hetzner CX22 (2 vCPU, 4 Go, ~4 €/mois). Un seul sandbox, limites serrées,
# tunnel Cloudflare gratuit pour le webhook WhatsApp (aucun port ouvert, pas de domaine requis).
#   docker compose -f docker-compose.yml -f docker-compose.eco.yml up -d --build
#   ou : ./install.sh --eco
services:
  db:
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30", "-c", "work_mem=4MB"]
    mem_limit: 256m

  sandbox:
    mem_limit: 2200m
    cpus: 1.5
    tmpfs:
      - /tmp:size=768m

  orchestrator:
    mem_limit: 512m
    environment:
      SWARM_CONCURRENCY: "3"
      SWARM_BUDGET_USD: "4"
      MISSION_BUDGET_USD: "1.5"
      DAILY_BUDGET_USD: "2.5"

  # Le navigateur du serveur est la pièce la plus gourmande de la pile : un
  # Chromium avec un écran. Sur 4 Go partagés, on le borne pour qu'il ne
  # prenne jamais la mémoire de la base ou de l'orchestrateur.
  desktop:
    mem_limit: 1500m
    cpus: 1
    shm_size: 512m
    environment:
      # 1024 de haut et non 800 : à 800, une fois la barre d'onglets et
      # d'adresse retirée, il restait ~710 px de page — le formulaire de
      # connexion d'un site courant (8K, 1 005 px) finissait sous le bord,
      # bouton compris. 1024 laisse ~930 px, assez pour la plupart ; le reste
      # se rattrape au bouton « Zoom − » de la télécommande (/screen).
      SCREEN: 1280x1024x24

  backup:
    mem_limit: 128m

  # Webhook WhatsApp exposé via Cloudflare Tunnel (gratuit). Crée un tunnel dans Zero Trust,
  # route <ton-sous-domaine> → http://orchestrator:8787, mets le token dans CLOUDFLARE_TUNNEL_TOKEN.
  # Sans domaine : un tunnel « quick » fonctionne aussi (voir docs/ECO.md).
  # Le tunnel n'existe que pour recevoir le webhook WhatsApp : il vit donc dans un
  # profil, et `install.sh` ne l'active que lorsqu'un canal WhatsApp est configuré.
  # `:-` plutôt que `:?` : Compose interpole TOUS les services, même ceux d'un profil
  # inactif — un `:?` ici bloquait l'installation entière sans WhatsApp.
  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [orchestrator]
    mem_limit: 64m
    networks: [internal, egress]

  # Sans domaine ni compte Cloudflare : un tunnel « quick » expose l'orchestrateur
  # sur une URL *.trycloudflare.com tirée au hasard, visible dans ses journaux.
  # Elle change à chaque redémarrage, donc le webhook Meta est à reconfigurer
  # ensuite — acceptable pour démarrer, pas pour durer.
  #   docker compose ... logs tunnel-quick   → l'URL du jour
  tunnel-quick:
    profiles: ["tunnel-quick"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://orchestrator:8787
    depends_on: [orchestrator]
    mem_limit: 64m
    networks: [internal, egress]
