[project]
name = "jarvis"
version = "0.1.0"
description = "Jarvis — couche vocale locale de Manzi Junior (Whisper entrée, Kokoro sortie)"
requires-python = ">=3.10,<3.13"
dependencies = [
  "anthropic[mcp]>=1.7,<2",
  "mcp>=2.2,<3",
  "openai>=1.60",
  "faster-whisper>=1.2,<2",
  "kokoro>=0.9.4,<1",
  "misaki[en]>=0.9.4",
  "phonemizer-fork>=3.3",
  "espeakng-loader>=0.2",
  "silero-vad>=6.0,<7",
  "sounddevice>=0.5",
  "numpy>=1.26",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.scripts]
jarvis = "jarvis.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]
